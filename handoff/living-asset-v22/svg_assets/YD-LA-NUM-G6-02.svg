    <rect x="0" y="0" width="560" height="220" rx="12" fill="url(#seaGrad)"/>
    <path d="M 0 62 Q 70 56 140 62 T 280 62 T 420 62 T 560 62" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
