    <text x="72" y="66" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="end">0 m (Mặt biển)</text>
    <text x="72" y="148" font-size="11.5" font-weight="700" fill="#FDE047" text-anchor="end">-120 m</text>
