name: H07 Playwright checks
on:
  pull_request:
    paths:
      - 'games/H07/**'
      - 'tests/h07.spec.js'
      - 'playwright.config.js'
      - 'package*.json'
      - '.github/workflows/h07-playwright.yml'
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
