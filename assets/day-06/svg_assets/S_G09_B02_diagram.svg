<svg viewBox="0 0 240 165" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="236" height="161" rx="8" fill="#FAFBFD" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="120" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1E293B">MINH HỌA HÌNH HỌC HỆ PHƯƠNG TRÌNH</text>
  <!-- Grid -->
  <g stroke="#E2E8F0" stroke-width="0.9">
    <line x1="40" y1="30" x2="40" y2="145"/><line x1="65" y1="30" x2="65" y2="145"/>
    <line x1="90" y1="30" x2="90" y2="145"/><line x1="115" y1="30" x2="115" y2="145"/>
    <line x1="140" y1="30" x2="140" y2="145"/><line x1="165" y1="30" x2="165" y2="145"/>
    <line x1="190" y1="30" x2="190" y2="145"/>
    <line x1="25" y1="45" x2="210" y2="45"/><line x1="25" y1="70" x2="210" y2="70"/>
    <line x1="25" y1="95" x2="210" y2="95"/><line x1="25" y1="120" x2="210" y2="120"/>
  </g>
  <!-- Axes: Origin O at (65, 120), 1 unit = 25px -->
  <line x1="25" y1="120" x2="212" y2="120" stroke="#334155" stroke-width="1.5"/>
  <line x1="65" y1="148" x2="65" y2="26" stroke="#334155" stroke-width="1.5"/>
  <text x="215" y="123" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155">x</text>
  <text x="68" y="29" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155">y</text>
  <text x="56" y="131" font-family="Arial, sans-serif" font-size="8.5" fill="#334155">O</text>

  <!-- Line 1: 2x + y = 5 => (0,5)->(65,-5) clip at (1,3)=(90,45) and (2.5,0)=(127.5,120) -->
  <line x1="82" y1="28" x2="138" y2="142" stroke="#2563EB" stroke-width="2"/>
  <!-- Line 2: x - y = 1 => (0,-1)=(65,145) and (4,3)=(165,45) -->
  <line x1="65" y1="145" x2="175" y2="35" stroke="#EA580C" stroke-width="2"/>

  <!-- Intersection M(2, 1) -> x = 65 + 50 = 115, y = 120 - 25 = 95 -->
  <line x1="115" y1="95" x2="115" y2="120" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="65" y1="95" x2="115" y2="95" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="115" cy="95" r="4" fill="#DC2626"/>
  <text x="115" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DC2626">2</text>
  <text x="56" y="98" text-anchor="end" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DC2626">1</text>
  <text x="155" y="96" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#DC2626">M(2 ; 1)</text>
  <text x="135" y="42" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#2563EB">2x + y = 5</text>
  <text x="172" y="64" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#EA580C">x – y = 1</text>
</svg>