  <!-- Bơi lội 20% (234 to 306 deg) -->
  <path d="M 75,92 L 32.9,122.6 A 52,52 0 0,1 32.9,61.4 Z" fill="#FACC15" stroke="#FFFFFF" stroke-width="1.5"/>
