  <rect x="138" y="108" width="10" height="10" fill="#F472B6"/>
  <text x="152" y="117" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">Cờ vua: 15%</text>
  <text x="120" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0F172A">Tổng mẫu: N = 200 học sinh (100%)</text>
