  <!-- Legend -->
  <rect x="138" y="42" width="10" height="10" fill="#38BDF8"/>
  <text x="152" y="51" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">Bóng đá: 40%</text>
  <rect x="138" y="64" width="10" height="10" fill="#4ADE80"/>
