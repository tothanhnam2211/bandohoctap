<svg viewBox="0 0 240 165" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="236" height="161" rx="8" fill="#FAFBFD" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="120" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1E293B">BIỂU ĐỒ QUẠT TRÒN MÔN THỂ THAO</text>
  <!-- Center (75, 92), R = 52 -->
  <!-- Bóng đá 40% (0 to 144 deg) -->
