<svg viewBox="0 0 240 165" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="236" height="161" rx="8" fill="#FAFBFD" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="120" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1E293B">CÂN THĂNG BẰNG PHƯƠNG TRÌNH ax + b = 0</text>
  <!-- Balance scale -->
  <polygon points="120,98 104,136 136,136" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
  <line x1="40" y1="98" x2="200" y2="98" stroke="#1E293B" stroke-width="3"/>
  <rect x="26" y="64" width="76" height="28" rx="5" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
  <text x="64" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369A1">3x – 5</text>
  <rect x="138" y="64" width="76" height="28" rx="5" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/>
  <text x="176" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#15803D">x + 7</text>
  <text x="120" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#DC2626">=</text>
  <text x="120" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#991B1B">Chuyển vế ĐỔI DẤU: 3x – x = 7 + 5  ⇔  2x = 12  ⇔  x = 6</text>
</svg>